<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="65歳超雇用推進助成金（65歳超継続雇用促進コース）の申請書類作成をサポートするAIエージェント。令和7年度版・令和8年度版に対応。">
<meta name="robots" content="noindex">
<title>書類作成AIエージェント | 65歳超雇用推進助成金</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent-r7: #2563eb;
    --accent-r8: #059669;
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .icon {
    font-size: 48px;
    line-height: 1;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }

  .disclaimer {
    color: #dc2626;
    font-size: 14px;
    margin: 0;
    font-weight: 500;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 640px) {
    .container { padding: 40px 20px; }
    h1 { font-size: 22px; }
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.06), 0 12px 28px rgba(0,0,0,0.08);
  }

  .card.r7:hover { border-color: var(--accent-r7); }
  .card.r8:hover { border-color: var(--accent-r8); }

  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
    align-self: flex-start;
    letter-spacing: 0.04em;
  }

  .card.r7 .badge {
    background: #eff6ff;
    color: var(--accent-r7);
  }

  .card.r8 .badge {
    background: #ecfdf5;
    color: var(--accent-r8);
  }

  .card h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  .card p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
    flex-grow: 1;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
  }

  .card.r7 .cta { color: var(--accent-r7); }
  .card.r8 .cta { color: var(--accent-r8); }

  .cta::after {
    content: "→";
    transition: transform 0.15s ease;
  }

  .card:hover .cta::after {
    transform: translateX(3px);
  }

  footer {
    margin-top: 56px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  .note {
    margin-top: 32px;
    padding: 16px 20px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    color: #78350f;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="icon" aria-hidden="true">🛡️</div>
      <h1>書類作成AIエージェント</h1>
      <p class="disclaimer">AIによる書類作成サポートです。<br>情報の正確性については保証されておりません。必要に応じて最新の公式情報をご確認ください。</p>
    </header>

    <main class="cards">
      <a class="card r7" href="https://jyoseikin-navi-r07.streamlit.app/" target="_blank" rel="noopener">
        <span class="badge">令和7年度版</span>
        <p>2025年4月～2026年3月までの支給要領に対応したエージェント</p>
        <span class="cta">エージェントを開く</span>
      </a>

      <a class="card r8" href="https://jyoseikin-navi-r08.streamlit.app/" target="_blank" rel="noopener">
        <span class="badge">令和8年度版</span>
        <p>2026年4月～2027年3月までの支給要領に対応したエージェント</p>
        <span class="cta">エージェントを開く</span>
      </a>
    </main>

    <div class="note">
      ※ 年度によって支給要領・様式が異なります。申請対象の年度に合わせて選択してください。
    </div>

    <footer>
      &copy; 書類作成AIエージェント
    </footer>
  </div>
</body>
</html>
